apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-health
  annotations:
    retry.linkerd.io/http: "503"
    retry.linkerd.io/limit: "1"
    timeout.linkerd.io/request: 5s
spec:
  parentRefs:
    - name: backend
      group: core
      kind: Service
      port: 3001
  rules:
    - matches:
        - method:
            type: Exact
            value: GET
          path:
            type: Exact
            value: /health
